<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Verse</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair">+</div>
      <div id="hint">Click to lock pointer. WASD to move, mouse to look.</div>
      <div id="mode" style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.4);color:#fff;padding:6px 8px;border-radius:6px;font-family:ui-sans-serif, system-ui;">Mode: Build</div>
      <div id="hotbar" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:8px;">
        <div class="slot" data-type="1" style="width:44px;height:44px;border:2px solid #fff;border-radius:6px;background:#5aa15a;"></div>
        <div class="slot" data-type="2" style="width:44px;height:44px;border:2px solid #888;border-radius:6px;background:#8b5a2b;"></div>
        <div class="slot" data-type="3" style="width:44px;height:44px;border:2px solid #888;border-radius:6px;background:#777777;"></div>
        <div class="slot" data-type="4" style="width:44px;height:44px;border:2px solid #888;border-radius:6px;background:#a07040;"></div>
        <div class="slot" data-type="5" style="width:44px;height:44px;border:2px solid #888;border-radius:6px;background:#d8c17a;"></div>
      </div>
      <div id="settings" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:16px 20px;border-radius:10px;display:none;font-family:ui-sans-serif, system-ui;min-width:260px;">
        <div style="margin-bottom:10px;font-weight:bold;">Settings</div>
        <label>Mouse sensitivity <input id="sensitivity" type="range" min="0.1" max="1.5" step="0.05" value="0.5"></label>
        <div style="height:8px"></div>
        <label>Move speed <input id="movespeed" type="range" min="5" max="60" step="1" value="20"></label>
        <div style="height:12px"></div>
        <div style="font-size:12px;opacity:0.8;">Press P to close</div>
      </div>
    </div>
    <div id="hud">
      <div id="crosshair">+</div>
      <div id="hint">Click to lock pointer. WASD to move, mouse to look.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
